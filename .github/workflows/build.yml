name: Build VPK (PSVita)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-vpk:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (SDL2)
        run: |
          vdpm status || true
          vdpm update || true
          vdpm install sdl2 || true
          vdpm install sdl2_image || true
          arm-vita-eabi-gcc --version
          cmake --version
          ls "$VITASDK/share/vita.toolchain.cmake"
          ls "$VITASDK/arm-vita-eabi/lib/" | grep -i -E "SDL2|png|jpeg" || true

      - name: Configure (Vita toolchain)
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j$(nproc) 2>&1 | tee build/build.log
          ls -lh build/*.vpk build/eboot.bin || ls -lh build/

      - name: Report build errors (public commit comment)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(build.log mancante)';
            try { log = fs.readFileSync('build/build.log', 'utf8'); } catch (e) {}
            const keep = log.split('\n').filter(l => /error|undefined reference|cannot find|No such|FAILED/i.test(l)).slice(-30);
            const body = 'Build VPK fallita, errori:\n```\n' + (keep.join('\n') || log.slice(-2000)) + '\n```';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: context.sha, body: body.slice(0, 6000)
            });

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: abisso-vpk
          path: build/*.vpk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-vpk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VPK
        uses: actions/download-artifact@v4
        with:
          name: abisso-vpk
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vpk
          generate_release_notes: true
